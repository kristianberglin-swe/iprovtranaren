.cat>*{position:relative;z-index:1}
.cat:hover{transform:translateY(-4px);border-color:#c8ce62;box-shadow:0 16px 30px #0008}
.cat .ico{font-size:38px;color:#d9dd92;font-weight:950}
.cat h2{margin:14px 0 8px;color:#fff;font-size:25px;text-transform:uppercase;letter-spacing:.01em}
.cat p{margin:0;color:#d5d8cf;line-height:1.45}
.cat b{display:block;margin-top:18px;color:#d8df66;text-transform:uppercase;letter-spacing:.06em}
.topNav{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}
.homeBtn,.btn{
  border:1px solid #72784a;background:#2b3329;color:#fff;border-radius:10px;padding:11px 16px;
  font-weight:900;cursor:pointer;box-shadow:0 5px 12px #0003
}
.homeBtn:hover,.btn:hover{background:#414a32}
.btn.secondary{background:#c9c6a5;color:#252b22;border-color:#aaa58e}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pill{background:#343c2e;color:#fff;border:1px solid #8e9555;border-radius:999px;padding:7px 11px;font-weight:900}
.source{color:#6b705d;font-size:13px}
.question{font-size:clamp(22px,3.2vw,34px);font-weight:950;line-height:1.15;margin:14px 0 24px}
.progress{height:9px;background:#d8d5c9;border-radius:999px;overflow:hidden;margin:10px 0 24px}
.progress>div{height:100%;background:linear-gradient(90deg,#59652d,#9ca53a)}
.image{background:#d8d5b8;border:1px solid #989875;border-radius:12px;padding:12px;text-align:center;margin:12px auto 20px}
.image img,
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opts.spatial{grid-template-columns:repeat(4,1fr)}
.opts.five{grid-template-columns:repeat(5,1fr)}
.opt{
  min-height:62px;border:1px solid #a8a58e;background:#e4e1c7;border-radius:11px;padding:13px;
  font-size:17px;font-weight:800;cursor:pointer;transition:.12s
}
.opt:hover{border-color:#687034;background:#f3f3e6;transform:translateY(-1px)}
.opt:disabled{opacity:.35;cursor:default;transform:none}
.feedback{margin-top:18px;padding:14px 16px;border-radius:11px;font-weight:850}
.feedback.ok{background:#e6efe1;border:1px solid #8cab78;color:#27451f}
.feedback.bad{background:#f4e3df;border:1px solid #c68d82;color:#702b23}
.actions,
.result{text-align:center}
.result h2{font-size:36px;margin:4px 0 12px;color:#2b3329}
.score{font-size:64px;font-weight:1000;color:#626c2f;line-height:1}
.breakdown{margin:22px auto;max-width:620px;text-align:left}
.breakdown div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #d5d1c2}

input.numAnswer{font:inherit;font-size:22px;padding:13px 14px;border:2px solid #a9a58e;border-radius:10px;max-width:230px;width:100%}
@media(max-width:760px){
  .head{align-items:flex-start}.count{font-size:12px}.categories{grid-template-columns:1fr}
  .cat{min-height:0}.opts,.opts.spatial,.opts.five{grid-template-columns:repeat(2,1fr)}.image{padding:7px}
}

.infoLinkWrap{display:flex;justify-content:center;margin:18px 0 2px}
.infoLink{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;
  background:#30382d;color:#fff;border:1px solid #929951;border-radius:10px;
  padding:12px 18px;font-weight:900;box-shadow:0 6px 15px #0004;
  transition:.15s
}
.infoLink:hover{background:#444d34;border-color:#c8ce62;transform:translateY(-2px)}
.infoLink span{color:#d8df66;font-size:20px}

/* v32 – full camouflage + stronger 3D depth */
html,body{min-height:100%;background-color:#343825}
body{

header{
  border-bottom:2px solid #11170f;
  box-shadow:0 8px 0 #171b13,0 16px 30px #000b,inset 0 -2px 0 #7f8739;
}
.card{
  background:linear-gradient(145deg,rgba(202,201,168,.97),rgba(166,169,126,.97));
  border:1px solid #747854;
  box-shadow:
    0 4px 0 #555a3d,
    0 10px 0 #282d22,
    0 22px 42px #000a,
    inset 2px 2px 0 rgba(255,255,255,.35),
    inset -3px -3px 0 rgba(63,68,45,.25);
}
.cat{
  border:1px solid #8e9555;
  box-shadow:
    0 4px 0 #666b3c,
    0 9px 0 #171c16,
    0 18px 28px #0009,
    inset 2px 2px 0 rgba(255,255,255,.13),
    inset -3px -3px 0 rgba(0,0,0,.45);
}
.cat:hover{
  transform:translateY(-5px);
  box-shadow:
    0 6px 0 #747b40,
    0 13px 0 #171c16,
    0 25px 36px #000b,
    inset 2px 2px 0 rgba(255,255,255,.16),
    inset -3px -3px 0 rgba(0,0,0,.5);
}
.opt,.homeBtn,.btn,.infoLink{
  box-shadow:
    0 3px 0 #6b7049,
    0 7px 0 #22271e,
    0 12px 18px #0005,
    inset 1px 1px 0 rgba(255,255,255,.28),
    inset -2px -2px 0 rgba(0,0,0,.18);
}
.opt:active,.homeBtn:active,.btn:active,.infoLink:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #444932,0 3px 7px #0006;
}
.image{
  box-shadow:
    inset 2px 2px 0 rgba(255,255,255,.32),
    inset -3px -3px 0 rgba(70,74,51,.20),
    0 5px 0 #777a59,
    0 10px 20px #0005;
}
.pill{
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.15),0 3px 0 #171b15,0 6px 10px #0004;
}


/* v35 – compact start: only real sections */
.startCard{max-width:1040px!important;margin:0 auto;padding:18px 22px 24px!important}
.startLogo{display:flex;justify-content:center;margin:0 0 18px}
.startLogo .brand{font-size:clamp(34px,5vw,62px)!important;padding:8px 28px 12px 18px!important}
.startLogo .brand span{color:#aeb443}
.compactCats{
  display:grid!important;
  grid-template-columns:repeat(3,minmax(0,1fr))!important;
  gap:18px!important;
  max-width:940px;margin:0 auto!important;
}
.compactCat{
  min-height:190px!important;
  padding:18px 15px!important;
  border-radius:13px!important;
  display:flex!important;flex-direction:column!important;
  align-items:center!important;justify-content:center!important;
  text-align:center!important;
}
.compactCat .ico{
  width:70px!important;height:70px!important;min-width:70px!important;
  font-size:25px!important;margin:0 auto 12px!important;
  border-radius:12px!important;
  display:flex!important;align-items:center!important;justify-content:center!important;
  box-shadow:inset 1px 1px 0 #ffffff30,0 4px 0 #151a13,0 8px 14px #0008!important;
}
.compactCat h2{font-size:20px!important;margin:3px 0 13px!important}
.compactCat p{display:none!important}
.compactCat b{font-size:13px!important}
.compactInfo{font-size:14px!important;padding:10px 16px!important;margin-top:4px}
@media(max-width:760px){
 .compactCats{grid-template-columns:1fr!important;gap:13px!important}
 .compactCat{min-height:120px!important}
 .compactCat .ico{width:54px!important;height:54px!important;min-width:54px!important;font-size:20px!important}
}


/* v37 – endast tre riktiga val, mindre och utan dubbel text */
.startCard{
  max-width:860px!important;
  margin:12px auto!important;
  padding:12px 16px 16px!important;
  background:rgba(38,44,29,.93)!important;
  border:1px solid #777d4b!important;
  box-shadow:0 5px 0 #151a12,0 14px 30px #000a,inset 1px 1px 0 #ffffff18!important;
}
.startLogo{margin:0 0 12px!important}
.startLogo .brand{
  font-size:clamp(28px,4vw,48px)!important;
  line-height:.76!important;
  padding:7px 22px 10px 14px!important;
  transform:skewX(-5deg) scale(.92)!important;
}
.compactCats{
  grid-template-columns:repeat(3,minmax(0,1fr))!important;
  gap:12px!important;
  max-width:790px!important;
}
.compactCat{
  min-height:132px!important;
  padding:12px 10px!important;
  border-radius:10px!important;
  box-shadow:0 3px 0 #60663b,0 7px 0 #141913,0 14px 22px #0009,
             inset 1px 1px 0 #ffffff24,inset -2px -2px 0 #0006!important;
}
.compactCat:hover{
  transform:translateY(-3px)!important;
  box-shadow:0 5px 0 #6c733e,0 9px 0 #141913,0 17px 26px #000a,
             inset 1px 1px 0 #ffffff2a,inset -2px -2px 0 #0006!important;
}
.compactCat .ico{
  width:48px!important;height:48px!important;min-width:48px!important;
  margin:0 auto 8px!important;font-size:18px!important;border-radius:9px!important;
}
.compactCat h2{
  font-size:15px!important;line-height:1!important;
  margin:2px 0 8px!important;white-space:nowrap!important;
}
.compactCat b{font-size:10px!important;letter-spacing:.03em!important}
.infoLinkWrap{margin:13px 0 0!important}
.compactInfo{

function seriesQ(l,i){
 let seq,ans,rule,t=i%10,k=Math.floor(i/10)+1;
 if(l==='easy'){
  if(t%3===0){let a=1+k+i%4,d=2+i%5;seq=[0,1,2,3,4].map(n=>a+n*d);ans=a+5*d;rule=`Varje tal ökar med ${d}.`}

  else{let a=2+i%5;seq=[a,a*2,a*4,a*8,a*16];ans=a*32;rule='Varje tal är dubbelt så stort som föregående.'}
 }else if(l==='medium'){
  if(t<4){let a=2+i%7,d1=2+(i%4),d2=d1+2+k;seq=[a,a+d1,a+d1+d2,a+2*d1+d2,a+2*d1+2*d2];ans=a+3*d1+2*d2;rule=`Ökningarna växlar +${d1}, +${d2}.`}

  else{let a=1+i%5;seq=[a,a+2,a+6,a+12,a+20];ans=a+30;rule='Ökningarna är +2, +4, +6, +8 och därefter +10.'}
 }else{

  else if(t===2){let a=4+k;seq=[a,a*2+1,(a*2+1)*2+2,((a*2+1)*2+2)*2+3,(((a*2+1)*2+2)*2+3)*2+4];ans=seq[4]*2+5;rule='Varje steg är ×2 och därefter +1, +2, +3, +4, +5.'}

function beginWords(){
 let qs=[];
 ['easy','medium','hard'].forEach(l=>{
  ['syn','ant'].forEach(type=>(wordSets[l]?.[type]||[]).forEach((x,i)=>{
    let correct=x[1],opts=shuffle(x.slice(1));
    qs.push({id:`${l}-${type}-${i}`,group:'Ordförståelse',subtype:type==='syn'?'Synonymer':'Antonymer',
      prompt:type==='syn'?`Vilket ord betyder ungefär samma sak som ”${x[0]}”?`:`Vilket ord betyder motsatsen till ”${x[0]}”?`,
      options:opts,correct,mode:'text'});
  }));
 });
 VERIFIED_WORDS.forEach(q=>qs.push({
   id:q.id,group:'Ordförståelse',subtype:'ORD – verifierad',
   source:q.source,prompt:q.prompt,options:q.options,correct:q.correct,mode:'text'
 }));
 begin(shuffle(qs),'Ordförståelse');
}
function beginSeries(){
 let qs=[];['easy','medium','hard'].forEach(l=>{let n=l==='hard'?40:24;for(let i=0;i<n;i++){let q=seriesQ(l,i);

let fullPrompt=seqText?`Vilket tal ska stå på nästa plats?<div class="seriesLine">${seqText}, ?</div>`:q.text;
qs.push({id:q.id,group:'Talserier',subtype:'Talserier',prompt:fullPrompt,options:q.opts,correct:q.correct,mode:'text'})}});
 VERIFIED_SERIES.forEach(q=>qs.push({

   source:q.source,prompt:q.prompt,options:q.options,correct:q.correct,mode:'text'
 }));
 begin(shuffle(qs),'Talserier');
}

function begin(qs,label){
 qs=shuffle(qs).slice(0,5);
 S={qs,i:0,k:0,done:false,per:{},label,wrong:[],reviewMode:false};
 render()
}
function render(){
 let q=S.qs[S.i];S.done=false;S.helpUsed=0;count.textContent=`${S.i+1} / ${S.qs.length}`;
 let image=q.image?`<div class="image"><img src="${q.image}" alt="Uppgift"></div>`:'';
 let answers='';
 if(q.optionImages) answers=`<div class="imgopts">${q.options.map(x=>`<button class="imgopt" data-a="${x}" onclick="pick(this,'${x}')"><span class="letter">${x}</span><img src="${q.optionImages[x]}"></button>`).join('')}</div>`;
 else if(q.mode==='number') answers=`<div class="num"><input id="n" type="number" inputmode="numeric" placeholder="Skriv ditt svar" onkeydown="if(event.key==='Enter')numberAnswer()"><button class="btn" onclick="numberAnswer()">Svara</button></div>`;
 else answers=`<div class="opts ${S.label==='Spatial förmåga'?'spatial':''} ${q.options?.length===5?'five':''}">${q.options.map((x,i)=>`<button class="opt" data-a="${String(x).replaceAll('"','&quot;')}" onclick="pick(this,this.dataset.a)">${S.label==='Spatial förmåga'?x:`<b>${String.fromCharCode(65+i)}.</b> ${x}`}</button>`).join('')}</div>`;
 app.innerHTML=`<section class="card"><div class="topNav"><button class="homeBtn" onclick="home()">← Till start</button></div><div class="progress"><i style="width:${100*S.i/S.qs.length}%"></i></div><div class="meta"><span class="pill">${q.subtype}</span>${q.source?`<span class="source">Källa: ${q.source}</span>`:''}</div><div class="question">${q.prompt}</div>${image}${answers}<div class="helpRow" id="helpRow"><button class="helpBtn" onclick="useHelp()">Hjälp</button><span id="helpText">Tar bort ett felaktigt alternativ</span></div><div id="fb"></div><div id="act"></div></section>`;
}

function useHelp(){
 if(S.done)return;
 let q=S.qs[S.i];
 if(q.mode==='number'){
   document.getElementById('helpText').textContent='Hjälp används bara på frågor med svarsalternativ.';
   return;
 }
 let candidates=[...document.querySelectorAll('[data-a]')].filter(b=>!b.classList.contains('helpHidden') && String(b.dataset.a)!==String(q.correct));
 if(!candidates.length){
   document.getElementById('helpText').textContent='Inga fler felaktiga alternativ att ta bort.';
   return;
 }
 let b=candidates[Math.floor(Math.random()*candidates.length)];
 b.classList.add('helpHidden');
 b.disabled=true;
 S.helpUsed=(S.helpUsed||0)+1;
 let left=[...document.querySelectorAll('[data-a]')].filter(x=>!x.classList.contains('helpHidden')).length;
 document.getElementById('helpText').textContent=`Ett felaktigt alternativ togs bort · ${left} alternativ kvar`;
}

function rec(q,ok){
 S.done=true;let hr=document.getElementById('helpRow');if(hr)hr.style.display='none';
 if(ok)S.k++; else S.wrong.push(q);
 S.per[q.subtype]??={n:0,k:0};S.per[q.subtype].n++;if(ok)S.per[q.subtype].k++;
 document.getElementById('fb').innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?'Rätt!':'Fel. Rätt svar är '+q.correct+'.'}</div>`;
 document.getElementById('act').innerHTML=`<div class="actions"><button class="btn secondary" onclick="home()">Startsida</button><button class="btn" onclick="next()">Nästa fråga →</button></div>`;
}
function pick(el,a){
 if(S.done)return;let q=S.qs[S.i],ok=String(a)===String(q.correct);
 document.querySelectorAll('[data-a]').forEach(b=>{b.disabled=true;if(String(b.dataset.a)===String(q.correct))b.classList.add('correct')});
 if(!ok)el.classList.add('wrong');rec(q,ok);
}
function numberAnswer(){if(S.done)return;let q=S.qs[S.i],n=document.getElementById('n'),a=n.value.trim();if(!a)return;n.disabled=true;rec(q,String(a)===String(q.correct))}
function next(){S.i++;S.i>=S.qs.length?finish():render()}
function retryWrong(){
 if(!S.wrong.length)return;
 let qs=[...S.wrong],label=S.label;
 S={qs:shuffle(qs),i:0,k:0,done:false,per:{},label,wrong:[],reviewMode:true};
 render();
}
function finish(){
 count.textContent='Klart';
 let rows=Object.entries(S.per).map(([x,v])=>`<div class="row"><span>${x}</span><b>${v.k}/${v.n}</b></div>`).join('');
 let wrongCount=S.wrong.length;
 app.innerHTML=`<section class="card result"><span class="pill">${S.reviewMode?'Gör om fel':'Resultat'}</span><div class="question">${S.label}</div><div class="score">${S.k}/${S.qs.length}</div><div class="break">${rows}</div>
 ${wrongCount?`<div class="feedback bad">${wrongCount} ${wrongCount===1?'fråga blev':'frågor blev'} fel.</div>`:`<div class="feedback ok">Alla rätt!</div>`}
 <div class="actions resultActions" style="justify-content:center">
   <button class="btn secondary" onclick="home()">← Till start</button>
   ${wrongCount?`<button class="btn retry" onclick="retryWrong()">Gör om de jag hade fel på</button>`:''}
   <button class="btn" onclick="${S.label==='Ordförståelse'?'beginWords()':S.label==='Talserier'?'beginSeries()':'beginSpatial()'}">Nya 5 frågor</button>
 </div></section>`;
}
home();
</script></body></html>
